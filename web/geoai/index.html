<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disaster Triage Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>body{margin:0;font:14px system-ui;display:grid;grid-template-columns:340px 1fr;height:100vh}
aside{overflow:auto;padding:12px;border-right:1px solid #ccc}#map{height:100vh}h3{margin:12px 0 4px}
table{border-collapse:collapse;width:100%}td,th{padding:2px 4px;border-bottom:1px solid #eee;text-align:left}.err{color:#b00}
@media(max-width:700px){body{display:block}#map{height:55vh}}</style></head>
<body><aside><h2>Triage dashboard</h2><div id="status">Loading…</div><div id="panel"></div></aside><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
const API=(new URLSearchParams(location.search).get("api"))||"http://localhost:8000/api/v1", e=React.createElement;
const get=p=>fetch(API+p).then(r=>{if(!r.ok)throw new Error(p+" → "+r.status);return r.json()});
const map=L.map("map").setView([0,0],2);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
let routeLayer;
const col=v=>["#2b83ba","#abdda4","#ffffbf","#fdae61","#d7191c"][Math.min(4,Math.round(v))];
function Panel({moran,abl,shap,sel}){
 const f=x=>x==null?"–":x.toFixed(3);
 return e("div",null,
  e("h3",null,"Global Moran's I"),e("div",null,`I=${f(moran.I)}  z=${f(moran.z)}  p=${f(moran.p)}  (n=${moran.n})`),
  e("h3",null,"Spatial-block CV ablation (R²)"),
  e("table",null,e("tr",null,["Stage","Random","Spatial"].map(h=>e("th",{key:h},h))),
   abl.map(a=>e("tr",{key:a.stage},e("td",null,a.stage),e("td",null,f(a.r2_random_cv)),e("td",null,f(a.r2_spatial_block_cv))))),
  e("h3",null,"Global TreeSHAP"),shap.map(s=>e("div",{key:s.feature},`${s.feature}: ${f(s.mean_abs_shap)}`)),
  e("h3",null,sel?`Building ${sel.building} SHAP`:"Click a building"),
  sel&&sel.contributions.map(c=>e("div",{key:c.feature},`${c.feature} = ${f(c.value)} → ${c.shap>=0?"+":""}${f(c.shap)}`)));
}
function App(){
 const [d,setD]=React.useState(null),[sel,setSel]=React.useState(null),[err,setErr]=React.useState(null);
 React.useEffect(()=>{Promise.all([get("/buildings"),get("/flood"),get("/moran"),get("/ablation"),get("/shap")]).then(([b,fl,moran,abl,shap])=>{
  const fg=L.geoJSON(fl,{style:{color:"#06c",weight:1,fillOpacity:.25}}).addTo(map);
  const bl=L.geoJSON(b,{style:f=>({color:col(f.properties.triage),weight:1,fillOpacity:.8}),
   onEachFeature:(f,l)=>l.on("click",async()=>{
     setSel(await get("/shap/"+f.properties.id));
     const r=await get("/route/"+f.properties.id); if(routeLayer)routeLayer.remove();
     routeLayer=L.geoJSON(r,{style:{color:"#000",weight:4}}).addTo(map).bindPopup(`${r.properties.length_m.toFixed(0)} m, ${r.properties.hazard_edges} hazard edges`).openPopup();})}).addTo(map);
  map.fitBounds(bl.getBounds());setD({moran,abl,shap});}).catch(x=>setErr(x.message))},[]);
 document.getElementById("status").innerHTML=err?`<span class=err>${err}</span>`:d?"Live data from "+API:"Loading…";
 return d?e(Panel,{...d,sel}):null;
}
ReactDOM.createRoot(document.getElementById("panel")).render(e(App));
</script></body></html>
